version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kyberchat-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - FRONTEND_URL=http://localhost:5173
      - BACKEND_URL=http://localhost:5000
      - MONGODB_URI=mongodb://host.docker.internal:27017
    networks:
      - kyberchat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kyberchat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - kyberchat-network

networks:
  kyberchat-network:
    driver: bridge
